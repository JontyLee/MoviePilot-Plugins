<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="TagFlow音乐库刮削">
  <defs>
    <linearGradient id="tfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#tfBg)"/>
  <!-- 流水线：一条折线把各环节串起来，末端收成标签的孔 -->
  <path d="M20 62C20 44 32 44 40 52s14 10 22 2"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".45"/>
  <circle cx="20" cy="62" r="7" fill="#ffffff"/>
  <circle cx="40" cy="52" r="7" fill="#ffffff"/>
  <circle cx="62" cy="54" r="7" fill="#ffffff"/>
  <!-- 标签：旋转的方块加孔，落在流水线尽头，表示「写进文件」 -->
  <g transform="rotate(45 74 34)">
    <path d="M64 24h20v20H64z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="74" cy="34" r="3.4" fill="#ffffff"/>
  </g>
</svg>
